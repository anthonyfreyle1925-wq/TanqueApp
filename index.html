  <script>
    (function generatePremiumAppIcon() {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        var ctx = canvas.getContext('2d');

        var bgGrad = ctx.createLinearGradient(0, 0, 512, 512);
        bgGrad.addColorStop(0, '#181A2F');
        bgGrad.addColorStop(0.55, '#242E49');
        bgGrad.addColorStop(1, '#54162B');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 512, 512);

        var glow = ctx.createRadialGradient(400, 100, 10, 400, 100, 320);
        glow.addColorStop(0, 'rgba(253, 164, 129, 0.28)');
        glow.addColorStop(0.5, 'rgba(180, 24, 45, 0.15)');
        glow.addColorStop(1, 'rgba(24, 26, 47, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 512, 512);

        ctx.beginPath();
        ctx.arc(256, 250, 182, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(55, 65, 92, 0.65)';
        ctx.lineWidth = 4;
        ctx.stroke();

        var arcGrad = ctx.createLinearGradient(90, 360, 420, 120);
        arcGrad.addColorStop(0, '#FDA481');
        arcGrad.addColorStop(0.6, '#E05A54');
        arcGrad.addColorStop(1, '#B4182D');

        ctx.beginPath();
        ctx.arc(256, 255, 148, Math.PI * 0.78, Math.PI * 2.22, false);
        ctx.strokeStyle = arcGrad;
        ctx.lineWidth = 22;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.save();
        ctx.translate(256, 255);
        ctx.rotate(-Math.PI * 0.18);
        var needleGrad = ctx.createLinearGradient(0, 0, 115, 0);
        needleGrad.addColorStop(0, 'rgba(253, 164, 129, 0.2)');
        needleGrad.addColorStop(1, '#FDA481');
        ctx.beginPath();
        ctx.moveTo(28, 0);
        ctx.lineTo(118, 0);
        ctx.strokeStyle = needleGrad;
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 108px -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('LT', 256, 252);

        ctx.fillStyle = '#FDA481';
        ctx.font = '700 28px monospace';
        ctx.fillText('1.5 TURBO', 256, 342);

        ctx.fillStyle = 'rgba(253, 164, 129, 0.85)';
        ctx.fillRect(216, 382, 80, 5);

        var dataUrl = canvas.toDataURL('image/png');
        document.getElementById('apple-icon-link').href = dataUrl;
        document.getElementById('fav-icon-link').href = dataUrl;
      } catch (e) {}
    })();
  </script>

    const toNum = (val) => {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const n = parseFloat(String(val).replace(',', '.'));
      return isNaN(n) ? 0 : n;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('nuevo');
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('captiva_records_v5');
        return saved ? JSON.parse(saved) : [];
      });

      const [parts, setParts] = useState(() => {

        return saved ? JSON.parse(saved) : DEFAULT_PARTS;
      });

      const [kitItems, setKitItems] = useState(() => {
        const saved = localStorage.getItem('captiva_kit_v1');
        return saved ? JSON.parse(saved) : DEFAULT_KIT_ITEMS;
      });

      const [savingsFund, setSavingsFund] = useState(() => {
        const saved = localStorage.getItem('captiva_savings_v1');
        return saved ? JSON.parse(saved) : { ahorrado: 40.00, meta: 300.00, ultimoAporte: '09/11/2026' };

        return saved ? JSON.parse(saved) : [

          }
        ];
      });

      const [isMatiasTyping, setIsMatiasTyping] = useState(false);
      const [useWebSearch, setUseWebSearch] = useState(true);
      const chatEndRef = useRef(null);

      const [filterPartStatus, setFilterPartStatus] = useState('Todas');

      const [editingPart, setEditingPart] = useState(null);

        kmProximoCambio: 104499,
        kmUltimaRotacion: 94499,
        costoEstimado: '',
        notas: ''
      });

      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('captiva_script_url') || '');
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('captiva_gemini_key') || '');
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState('En línea');
      const [copiedScript, setCopiedScript] = useState(false);
      const [copiedText, setCopiedText] = useState('');

      const [invoiceImg, setInvoiceImg] = useState(null);
      const [dashImg, setDashImg] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [scanError, setScanError] = useState('');
      const [editHighlight, setEditHighlight] = useState(false);

      const [form, setForm] = useState({
        fecha: new Date().toLocaleDateString('es-EC'),
        odometro: '',
        recorrido: '',
        galones: '',
        tipoGasolina: 'Súper',
        subtotal: '',
        iva: '',
        costoTotal: '',
        metodoPago: 'Tarjeta Primax',
        facturaNo: '',
        estacion: '',
      });

      const invCamRef = useRef(null);

      const dashCamRef = useRef(null);

      useEffect(() => {

      }, [records]);

      }, [kitItems]);

        }
      }, [matiasMessages, activeTab]);

      const fetchFromGoogleSheets = async () => {
        if (!scriptUrl) return;
        setIsSyncing(true);
        setSyncStatus('Sincronizando...');
        try {
          const res = await fetch(scriptUrl + '?t=' + Date.now());
          const rawData = await res.json();
          const fuelRows = Array.isArray(rawData) ? rawData : (rawData.fuel || []);

          if (Array.isArray(fuelRows)) {
            const normalized = fuelRows.map((r, idx) => {
              const odo = toNum(r.odometro);
              const trip = toNum(r.recorrido);
              const gal = toNum(r.galones);
              const total = toNum(r.costoTotal);
              const pGal = toNum(r.precioGalon) || (gal > 0 ? Number((total / gal).toFixed(2)) : 0);
              const rend = toNum(r.rendimiento) || (gal > 0 && trip > 0 ? Number((trip / gal).toFixed(2)) : 0);
              const cKm = toNum(r.costoKm) || (trip > 0 && total > 0 ? Number((total / trip).toFixed(4)) : 0);
              const kmMant = toNum(r.kmMantenimiento) || Math.max(0, MAINTENANCE_GOAL - odo);
              return {
                ...r,
                id: r.id || idx,
                odometro: odo,
                recorrido: trip,
                galones: gal,
                costoTotal: total,
                precioGalon: pGal,
                rendimiento: rend,
                costoKm: cKm,
                kmMantenimiento: kmMant,
                metodoPago: r.metodoPago || 'Tarjeta Primax',
                facturaNo: r.facturaNo || 'S/N',
                estacion: r.estacion || 'EESS',
              };
            });
            setRecords(normalized);
          }
          setSyncStatus('Google Sheets Activo');
        } catch (err) {
          setSyncStatus('Modo Local');
        } finally {
          setIsSyncing(false);
        }

        fetchFromGoogleSheets();
        const handleVisibility = () => {
          if (document.visibilityState === 'visible') fetchFromGoogleSheets();
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => document.removeEventListener('visibilitychange', handleVisibility);

      const totalPrimax = records

            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_SIZE = 1200;
              let width = img.width;
              let height = img.height;
              if (width > height && width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
              } else if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.78));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

      const codigoAppsScript = `function toNum(val) {
  if (typeof val === 'number') return val;
  if (!val) return 0;
  var clean = String(val).replace(/\\$/g, '').replace(/\\s/g, '').replace(',', '.');
  var n = parseFloat(clean);
  return isNaN(n) ? 0 : n;
}
function formatDate(val) {
  if (!val) return "";
  if (Object.prototype.toString.call(val) === '[object Date]') {
    return Utilities.formatDate(val, Session.getScriptTimeZone(), "dd/MM/yyyy");
  }
  return String(val);
}
function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheets()[0];
  var rows = sheet.getDataRange().getValues();
  var fuel = [];
  if (rows.length > 1) {
    for (var i = rows.length - 1; i >= 1; i--) {
      var r = rows[i];
      if (!r[0] && !r[1]) continue;
      var recorrido = toNum(r[2]);
      var galones = toNum(r[3]);
      var costoTotal = toNum(r[5]);
      var precioGalon = toNum(r[6]) || (galones > 0 ? Number((costoTotal / galones).toFixed(2)) : 0);
      var rendimiento = toNum(r[14]) || ((galones > 0 && recorrido > 0) ? Number((recorrido / galones).toFixed(2)) : 0);
      var costoKm = toNum(r[15]) || ((recorrido > 0 && costoTotal > 0) ? Number((costoTotal / recorrido).toFixed(4)) : 0);
      fuel.push({
        id: i, fecha: formatDate(r[0]), odometro: toNum(r[1]), recorrido: recorrido,
        galones: galones, tipoGasolina: r[4] || "Súper", costoTotal: costoTotal,
        precioGalon: precioGalon, subtotal: toNum(r[7]), iva: toNum(r[8]),
        metodoPago: r[9] || "Tarjeta Primax", kmMantenimiento: toNum(r[10]),
        facturaNo: r[11] || "S/N", estacion: r[12] || "",
        leyendaMantenimiento: r[13] || "", rendimiento: rendimiento, costoKm: costoKm
      });
    }
  }
  return ContentService.createTextOutput(JSON.stringify(fuel)).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var d = JSON.parse(e.postData.contents);
  if (d.action === "save_part" && d.part) {
    var pSheet = ss.getSheetByName("Inventario_Piezas");
    if (!pSheet) {
      pSheet = ss.insertSheet("Inventario_Piezas");
      pSheet.appendRow(["ID", "Pieza / Repuesto", "Categoría", "Especificación", "Estado", "Fecha Último Cambio", "Km Último Cambio", "Km Próximo Cambio", "Km Última Rotación", "Costo Estimado ($)", "Notas"]);
    }

    return ContentService.createTextOutput(JSON.stringify({status: "part_saved"})).setMimeType(ContentService.MimeType.JSON);
  }
  if (d.action === "save_fund" && d.fund) {
    var fSheet = ss.getSheetByName("Alcancia_Mantenimiento");
    if (!fSheet) {
      fSheet = ss.insertSheet("Alcancia_Mantenimiento");
      fSheet.appendRow(["Fecha Actualización", "Saldo Ahorrado ($)", "Meta Mantenimiento 102k ($)"]);
    }
    fSheet.appendRow([d.fund.ultimoAporte, d.fund.ahorrado, d.fund.meta]);
    return ContentService.createTextOutput(JSON.stringify({status: "fund_saved"})).setMimeType(ContentService.MimeType.JSON);
  }
  var sheet = ss.getSheets()[0];
  var kmRest = Number(d.kmMantenimiento) || Math.max(0, 102000 - Number(d.odometro));
  var recorrido = Number(d.recorrido) || 0;
  var galones = Number(d.galones) || 0;
  var costoTotal = Number(d.costoTotal) || 0;
  var rendimiento = Number(d.rendimiento) || (galones > 0 && recorrido > 0 ? Number((recorrido / galones).toFixed(2)) : 0);
  var costoKm = Number(d.costoKm) || (recorrido > 0 && costoTotal > 0 ? Number((costoTotal / recorrido).toFixed(4)) : 0);
  sheet.appendRow([
    d.fecha, Number(d.odometro), recorrido, galones, d.tipoGasolina || "Súper",
    costoTotal, Number(d.precioGalon), Number(d.subtotal), Number(d.iva),
    d.metodoPago, kmRest, d.facturaNo || "S/N", d.estacion || "EESS",
    "Mantenimiento en " + kmRest.toLocaleString() + " km", rendimiento, costoKm
  ]);
  return ContentService.createTextOutput(JSON.stringify({status: "ok"})).setMimeType(ContentService.MimeType.JSON);
}`;

                        step="any"
                        value={partForm.costoEstimado}
                        onChange={(e) => setPartForm({ ...partForm, costoEstimado: e.target.value })}
                        className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-2.5 py-2 text-xs text-white font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-300">Notas / Marca / Taller</label>
                    <input
                      type="text"
                      placeholder="Ej. Cambiadas hace 2 semanas"
                      value={partForm.notas}
                      onChange={(e) => setPartForm({ ...partForm, notas: e.target.value })}
                      className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2.5 pt-2">
                  <button
                    onClick={() => setShowAddPartModal(false)}
                    className="py-2.5 btn-slate text-slate-200 font-bold rounded-2xl text-xs"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={guardarPiezaModal}
                    className="py-2.5 btn-sunset text-white font-extrabold rounded-2xl text-xs"
                  >
                    Guardar Pieza
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE CONFIGURACIÓN SYNC */}
          {showSyncModal && (
            <div className="fixed inset-0 bg-[#181A2F]/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="premium-card rounded-3xl p-5 max-w-md w-full space-y-3.5 max-h-[90vh] overflow-y-auto">
                <h3 className="font-extrabold text-sm text-[#FDA481]">Conexión Google Sheets & Matías IA</h3>

                <div>
                  <label className="text-[11px] text-slate-300 block mb-1">
                    1. URL de tu Apps Script (Termina en /exec):
                  </label>
                  <input
                    type="text"
                    placeholder="https://script.google.com/macros/s/.../exec"
                    value={scriptUrl}
                    onChange={(e) => {
                      setScriptUrl(e.target.value);
                      localStorage.setItem('captiva_script_url', e.target.value);
                    }}
                    className="w-full bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>

                <div>
                  <label className="text-[11px] text-slate-300 block mb-1">
                    2. Gemini API Key (Activa el escáner de fotos y a Matías IA):
                  </label>
                  <input
                    type="password"
                    placeholder="AIzaSy..."
                    value={geminiKey}
                    onChange={(e) => {
                      setGeminiKey(e.target.value);
                      localStorage.setItem('captiva_gemini_key', e.target.value);
                    }}
                    className="w-full bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <p className="text-[11px] text-slate-300">Código Apps Script (16 cols + Piezas + Alcancía):</p>
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(codigoAppsScript);
                        setCopiedScript(true);
                        setTimeout(() => setCopiedScript(false), 2000);
                      }}
                      className="text-[11px] bg-[#54162B] border border-[#FDA481]/50 text-[#FDA481] px-2.5 py-1 rounded-xl font-bold"
                    >
                      {copiedScript ? '✓ Copiado' : 'Copiar código'}
                    </button>
                  </div>
                  <pre className="bg-[#181A2F] p-2.5 rounded-2xl text-[10px] text-[#FDA481] overflow-x-auto border border-[#37415C] select-all font-mono">
                    {codigoAppsScript}
                  </pre>
                </div>

                <button
                  onClick={() => {
                    setShowSyncModal(false);
                    fetchFromGoogleSheets();
                  }}
                  className="w-full py-3 btn-sunset text-white font-extrabold rounded-2xl text-xs"
                >
                  Guardar y Sincronizar Base
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

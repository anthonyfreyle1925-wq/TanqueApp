<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Configuración PWA para iPhone a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Captiva LT" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933939.png" />

  <title>Captiva LT 1.5 Turbo - Control</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input, select, button {
      font-size: 16px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const MAINTENANCE_GOAL = 102000;
    const MONTHLY_AVG_KM = 1145;
    const FIXED_PARKING = 48.88;

    const toNum = (val) => {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const n = parseFloat(String(val).replace(',', '.'));
      return isNaN(n) ? 0 : n;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('nuevo');
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('captiva_records_v3');
        return saved ? JSON.parse(saved) : [];
      });

      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('captiva_script_url') || '');
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('captiva_gemini_key') || '');
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Listo');
      const [copiedScript, setCopiedScript] = useState(false);

      const [invoiceImg, setInvoiceImg] = useState(null);
      const [dashImg, setDashImg] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [scanError, setScanError] = useState('');
      const [editHighlight, setEditHighlight] = useState(false);

      const [form, setForm] = useState({
        fecha: new Date().toLocaleDateString('es-EC'),
        odometro: '',
        recorrido: '',
        galones: '',
        tipoGasolina: 'Súper',
        subtotal: '',
        iva: '',
        costoTotal: '',
        metodoPago: 'Tarjeta Primax',
        facturaNo: '',
        estacion: '',
      });

      const invGalleryRef = useRef(null);
      const invCamRef = useRef(null);
      const dashGalleryRef = useRef(null);
      const dashCamRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('captiva_records_v3', JSON.stringify(records));
      }, [records]);

      const fetchFromGoogleSheets = async () => {
        if (!scriptUrl) return;
        setIsSyncing(true);
        setSyncStatus('Consultando Google Sheets...');
        try {
          const res = await fetch(scriptUrl + '?t=' + Date.now());
          const rawData = await res.json();
          if (Array.isArray(rawData)) {
            const normalized = rawData.map((r, idx) => {
              const odo = toNum(r.odometro);
              const trip = toNum(r.recorrido);
              const gal = toNum(r.galones);
              const total = toNum(r.costoTotal);
              const pGal = toNum(r.precioGalon) || (gal > 0 ? Number((total / gal).toFixed(2)) : 0);
              const rend = toNum(r.rendimiento) || (gal > 0 && trip > 0 ? Number((trip / gal).toFixed(2)) : 0);
              const cKm = toNum(r.costoKm) || (trip > 0 && total > 0 ? Number((total / trip).toFixed(4)) : 0);
              const kmMant = toNum(r.kmMantenimiento) || Math.max(0, MAINTENANCE_GOAL - odo);
              return {
                ...r,
                id: r.id || idx,
                odometro: odo,
                recorrido: trip,
                galones: gal,
                costoTotal: total,
                precioGalon: pGal,
                rendimiento: rend,
                costoKm: cKm,
                kmMantenimiento: kmMant,
                metodoPago: r.metodoPago || 'Tarjeta Primax',
                facturaNo: r.facturaNo || 'S/N',
                estacion: r.estacion || 'EESS',
              };
            });
            setRecords(normalized);
            setSyncStatus('Sincronizado con Google Sheets');
          }
        } catch (err) {
          setSyncStatus('Usando copia local (Verifica URL Sync)');
        } finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        fetchFromGoogleSheets();
        const handleVisibility = () => {
          if (document.visibilityState === 'visible') fetchFromGoogleSheets();
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => document.removeEventListener('visibilitychange', handleVisibility);
      }, [scriptUrl, activeTab]);

      const compressImage = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_SIZE = 1200;
              let width = img.width;
              let height = img.height;
              if (width > height && width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
              } else if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.78));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      };

      const handleImageSelect = async (e, type) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressed = await compressImage(file);
          if (type === 'invoice') setInvoiceImg(compressed);
          else setDashImg(compressed);
          setScanError('');
        } catch (err) {
          setScanError('No se pudo procesar la foto.');
        }
      };

      const extractDataFromPhotos = async () => {
        if (!invoiceImg && !dashImg) {
          setScanError('Selecciona primero la foto de la factura o del tablero.');
          return;
        }
        setIsScanning(true);
        setScanError('');

        if (!geminiKey) {
          setIsScanning(false);
          setEditHighlight(true);
          setScanError('Falta tu Gemini API Key en "⚙️ Configurar Sync". Agrégala o completa los datos manualmente en el Paso 3.');
          return;
        }

        try {
          const parts = [
            {
              text: `Analiza estas imágenes de una factura de gasolina de Ecuador y/o el tablero de una Chevrolet Captiva. Devuelve ÚNICAMENTE un JSON válido con esta estructura exacta (usa punto para decimales): {"fecha": "DD/MM/YYYY", "odometro": 0, "recorrido": 0, "galones": 0, "subtotal": 0, "iva": 0, "costoTotal": 0, "facturaNo": "", "estacion": ""}`
            }
          ];

          if (invoiceImg) {
            parts.push({ inline_data: { mime_type: 'image/jpeg', data: invoiceImg.split(',')[1] } });
          }
          if (dashImg) {
            parts.push({ inline_data: { mime_type: 'image/jpeg', data: dashImg.split(',')[1] } });
          }

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey.trim()}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts }] })
            }
          );

          const result = await response.json();
          if (result.error) {
            throw new Error(result.error.message || 'API Key inválida');
          }

          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('No se pudo leer el formato JSON');

          const parsed = JSON.parse(jsonMatch[0]);
          const lastOdo = records.length > 0 ? toNum(records[0].odometro) : 0;
          const newOdo = parsed.odometro ? toNum(parsed.odometro) : '';
          let calcTrip = parsed.recorrido ? toNum(parsed.recorrido) : '';

          // Si el trip viene en 0 o se acumuló sin reiniciar, calcula la diferencia real contra el último odómetro en base
          if (lastOdo > 0 && newOdo > lastOdo && (!calcTrip || calcTrip === 0 || calcTrip > (newOdo - lastOdo) * 1.4)) {
            calcTrip = Number((newOdo - lastOdo).toFixed(1));
          }

          const totalExtraido = parsed.costoTotal ? toNum(parsed.costoTotal) : '';
          const subExtraido = parsed.subtotal ? toNum(parsed.subtotal) : (totalExtraido ? Number((totalExtraido / 1.15).toFixed(2)) : '');
          const ivaExtraido = parsed.iva ? toNum(parsed.iva) : (totalExtraido && subExtraido ? Number((totalExtraido - subExtraido).toFixed(2)) : '');

          setForm((prev) => ({
            ...prev,
            fecha: parsed.fecha || prev.fecha,
            odometro: newOdo !== '' ? newOdo : prev.odometro,
            recorrido: calcTrip !== '' ? calcTrip : prev.recorrido,
            galones: parsed.galones ? toNum(parsed.galones) : prev.galones,
            subtotal: subExtraido !== '' ? subExtraido : prev.subtotal,
            iva: ivaExtraido !== '' ? ivaExtraido : prev.iva,
            costoTotal: totalExtraido !== '' ? totalExtraido : prev.costoTotal,
            facturaNo: parsed.facturaNo || prev.facturaNo,
            estacion: parsed.estacion || prev.estacion,
          }));
          setEditHighlight(true);
        } catch (err) {
          setScanError('Detalle IA: ' + err.message + '. Puedes revisar o editar los campos directamente en el Paso 3.');
          setEditHighlight(true);
        } finally {
          setIsScanning(false);
        }
      };

      const ultimoRegistro = records.length > 0 ? records[0] : null;
      const odoNum = toNum(form.odometro);
      const tripInput = toNum(form.recorrido);
      // Si el usuario dejó Recorrido en 0 pero hay un odómetro anterior en la base, sugerimos la resta automática
      const tripEfectivo =
        tripInput > 0
          ? tripInput
          : ultimoRegistro && odoNum > toNum(ultimoRegistro.odometro)
          ? Number((odoNum - toNum(ultimoRegistro.odometro)).toFixed(1))
          : 0;

      const galNum = toNum(form.galones);
      const totalNum = toNum(form.costoTotal);

      const rendimientoReal = galNum > 0 && tripEfectivo > 0 ? (tripEfectivo / galNum).toFixed(2) : '0.00';
      const costoPorKm = tripEfectivo > 0 && totalNum > 0 ? (totalNum / tripEfectivo).toFixed(4) : '0.0000';
      const precioGalon = galNum > 0 && totalNum > 0 ? (totalNum / galNum).toFixed(2) : '0.00';
      const kmRestantesMant = odoNum > 0 ? Math.max(0, MAINTENANCE_GOAL - odoNum) : MAINTENANCE_GOAL;

      const guardarYSubirASheets = async () => {
        if (!odoNum || !galNum || !totalNum) {
          alert('Verifica que Odómetro, Galones y Costo Total tengan valores en el Paso 3.');
          return;
        }

        const subNum = toNum(form.subtotal) || Number((totalNum / 1.15).toFixed(2));
        const ivaNum = toNum(form.iva) || Number((totalNum - subNum).toFixed(2));

        const nuevoRegistro = {
          id: Date.now(),
          fecha: form.fecha,
          odometro: odoNum,
          recorrido: tripEfectivo,
          galones: galNum,
          tipoGasolina: form.tipoGasolina,
          costoTotal: totalNum,
          precioGalon: toNum(precioGalon),
          subtotal: subNum,
          iva: ivaNum,
          metodoPago: form.metodoPago,
          kmMantenimiento: kmRestantesMant,
          facturaNo: form.facturaNo || 'S/N',
          estacion: form.estacion || 'ATIMASA / Primax',
          rendimiento: toNum(rendimientoReal),
          costoKm: toNum(costoPorKm),
        };

        setRecords([nuevoRegistro, ...records]);

        if (scriptUrl) {
          setIsSyncing(true);
          setSyncStatus('Subiendo fila a Google Sheets...');
          try {
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(nuevoRegistro),
            });
            setSyncStatus('¡Guardado en Google Sheets!');
            setTimeout(() => fetchFromGoogleSheets(), 1400);
          } catch (e) {
            setSyncStatus('Guardado local (Error de red con Sheets)');
          } finally {
            setIsSyncing(false);
          }
        }

        setInvoiceImg(null);
        setDashImg(null);
        setEditHighlight(false);
        setForm((prev) => ({
          ...prev,
          odometro: '',
          recorrido: '',
          galones: '',
          subtotal: '',
          iva: '',
          costoTotal: '',
          facturaNo: '',
          estacion: '',
        }));
        alert('✅ Registro guardado en las 14 columnas de tu Google Sheet.');
      };

      const totalPrimax = records
        .filter((r) => r.metodoPago === 'Tarjeta Primax')
        .reduce((acc, r) => acc + toNum(r.costoTotal), 0);
      const totalAnthony = records
        .filter((r) => r.metodoPago === 'Tarjeta de Anthony')
        .reduce((acc, r) => acc + toNum(r.costoTotal), 0);
      const totalEfectivo = records
        .filter((r) => r.metodoPago === 'Efectivo')
        .reduce((acc, r) => acc + toNum(r.costoTotal), 0);

      const registrosConCostoKm = records.filter((r) => toNum(r.costoKm) > 0);
      const costoKmPromedio =
        registrosConCostoKm.length > 0
          ? registrosConCostoKm.reduce((acc, r) => acc + toNum(r.costoKm), 0) / registrosConCostoKm.length
          : 0.2065;
      const gastoGasolinaMensualProyectado = costoKmPromedio * MONTHLY_AVG_KM;
      const presupuestoOperativoTotal = gastoGasolinaMensualProyectado + FIXED_PARKING;

      const codigoAppsScript = `function toNum(val) {
  if (typeof val === 'number') return val;
  if (!val) return 0;
  var clean = String(val).replace(/\\$/g, '').replace(/\\s/g, '').replace(',', '.');
  var n = parseFloat(clean);
  return isNaN(n) ? 0 : n;
}
function formatDate(val) {
  if (!val) return "";
  if (Object.prototype.toString.call(val) === '[object Date]') {
    return Utilities.formatDate(val, Session.getScriptTimeZone(), "dd/MM/yyyy");
  }
  return String(val);
}
function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var rows = sheet.getDataRange().getValues();
  if (rows.length <= 1) return ContentService.createTextOutput("[]").setMimeType(ContentService.MimeType.JSON);
  var data = [];
  for (var i = rows.length - 1; i >= 1; i--) {
    var r = rows[i];
    if (!r[0] && !r[1]) continue;
    var recorrido = toNum(r[2]);
    var galones = toNum(r[3]);
    var costoTotal = toNum(r[5]);
    var precioGalon = toNum(r[6]) || (galones > 0 ? Number((costoTotal / galones).toFixed(2)) : 0);
    var rendimiento = (galones > 0 && recorrido > 0) ? Number((recorrido / galones).toFixed(2)) : 0;
    var costoKm = (recorrido > 0 && costoTotal > 0) ? Number((costoTotal / recorrido).toFixed(4)) : 0;
    data.push({
      id: i, fecha: formatDate(r[0]), odometro: toNum(r[1]), recorrido: recorrido,
      galones: galones, tipoGasolina: r[4] || "Súper", costoTotal: costoTotal,
      precioGalon: precioGalon, subtotal: toNum(r[7]), iva: toNum(r[8]),
      metodoPago: r[9] || "Tarjeta Primax", kmMantenimiento: toNum(r[10]),
      facturaNo: r[11] || "S/N", estacion: r[12] || "",
      leyendaMantenimiento: r[13] || "", rendimiento: rendimiento, costoKm: costoKm
    });
  }
  return ContentService.createTextOutput(JSON.stringify(data)).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var d = JSON.parse(e.postData.contents);
  var kmRest = Number(d.kmMantenimiento) || Math.max(0, 102000 - Number(d.odometro));
  sheet.appendRow([
    d.fecha, Number(d.odometro), Number(d.recorrido), Number(d.galones),
    d.tipoGasolina || "Súper", Number(d.costoTotal), Number(d.precioGalon),
    Number(d.subtotal), Number(d.iva), d.metodoPago, kmRest,
    d.facturaNo || "S/N", d.estacion || "EESS", "Mantenimiento en " + kmRest.toLocaleString() + " km"
  ]);
  return ContentService.createTextOutput(JSON.stringify({status: "ok"})).setMimeType(ContentService.MimeType.JSON);
}`;

      return (
        <div className="max-w-md mx-auto min-h-screen pb-24 px-3 pt-3">
          {/* CABECERA */}
          <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 mb-3 shadow-lg">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-xl shadow">
                  ⛽
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-bold text-sm tracking-wide text-white">CAPTIVA LT 1.5 TURBO</h1>
                    <span className="text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1.5 py-0.5 rounded">
                      GTF2348
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    {syncStatus} • Meta: <span className="text-emerald-400 font-semibold">102,000 km</span>
                  </p>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2 mt-3">
              <button
                onClick={fetchFromGoogleSheets}
                className="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 rounded-xl py-2 text-xs font-semibold transition"
              >
                <span>🔄</span> {isSyncing ? 'Consultando...' : 'Refrescar Base'}
              </button>
              <button
                onClick={() => setShowSyncModal(true)}
                className="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl py-2 text-xs font-semibold transition"
              >
                <span>⚙️</span> Configurar Sync
              </button>
            </div>
          </div>

          {/* TARJETA FIJA DEL ÚLTIMO REGISTRO EN GOOGLE SHEETS */}
          <div className="bg-gradient-to-r from-slate-900 via-slate-900 to-cyan-950/50 border border-cyan-500/30 rounded-2xl p-3.5 mb-3 shadow">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-[11px] font-bold uppercase tracking-wider text-cyan-400">
                📌 Último Registro en Base (Google Sheets)
              </span>
              {ultimoRegistro && (
                <span className="text-[11px] text-slate-300 font-medium">{ultimoRegistro.fecha}</span>
              )}
            </div>
            {ultimoRegistro ? (
              <div className="space-y-1.5">
                <div className="grid grid-cols-4 gap-2 text-center bg-slate-950/60 rounded-xl p-2 border border-slate-800/80">
                  <div>
                    <p className="text-[10px] text-slate-400">Odómetro</p>
                    <p className="text-xs font-bold text-white">{toNum(ultimoRegistro.odometro).toLocaleString()} km</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-400">Costo Total</p>
                    <p className="text-xs font-bold text-emerald-400">${toNum(ultimoRegistro.costoTotal).toFixed(2)}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-400">Galones</p>
                    <p className="text-xs font-bold text-cyan-300">{toNum(ultimoRegistro.galones).toFixed(3)}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-400">Pago</p>
                    <p className="text-[10px] font-semibold text-amber-300 truncate">{ultimoRegistro.metodoPago}</p>
                  </div>
                </div>
                <div className="flex justify-between text-[11px] text-slate-400 px-1">
                  <span>⛽ {ultimoRegistro.estacion || 'Gasolinera'}</span>
                  <span className="text-emerald-400 font-semibold">
                    🛠️ Próx. Mant: en {toNum(ultimoRegistro.kmMantenimiento).toLocaleString()} km
                  </span>
                </div>
              </div>
            ) : (
              <p className="text-xs text-slate-400">
                Sin registros cargados aún. Toca "Refrescar Base" o revisa tu URL de Apps Script.
              </p>
            )}
          </div>

          {/* NAVEGACIÓN */}
          <div className="grid grid-cols-3 gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800 mb-3">
            <button
              onClick={() => setActiveTab('nuevo')}
              className={`py-2 rounded-lg text-xs font-bold transition ${
                activeTab === 'nuevo' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400'
              }`}
            >
              ➕ Nuevo Tanqueo
            </button>
            <button
              onClick={() => setActiveTab('reporte')}
              className={`py-2 rounded-lg text-xs font-bold transition ${
                activeTab === 'reporte' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400'
              }`}
            >
              📊 Reporte Mensual
            </button>
            <button
              onClick={() => setActiveTab('sheets')}
              className={`py-2 rounded-lg text-xs font-bold transition ${
                activeTab === 'sheets' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400'
              }`}
            >
              🗂️ Base ({records.length})
            </button>
          </div>

          {/* PESTAÑA 1: NUEVO TANQUEO */}
          {activeTab === 'nuevo' && (
            <div className="space-y-3">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3">
                <h2 className="text-xs font-bold uppercase tracking-wider text-cyan-400">
                  Paso 1: Captura Factura y Tablero
                </h2>

                <div className="border border-dashed border-slate-700 rounded-xl p-3 text-center bg-slate-950/40">
                  <p className="text-xs font-semibold text-slate-300 mb-2">🧾 Foto de la Factura</p>
                  {invoiceImg && (
                    <div className="mb-2">
                      <img src={invoiceImg} alt="Factura" className="h-28 mx-auto rounded-lg object-cover border border-slate-700" />
                      <span className="text-[11px] text-emerald-400 font-medium">✓ Factura lista</span>
                    </div>
                  )}
                  <input type="file" accept="image/*" ref={invGalleryRef} className="hidden" onChange={(e) => handleImageSelect(e, 'invoice')} />
                  <input type="file" accept="image/*" capture="environment" ref={invCamRef} className="hidden" onChange={(e) => handleImageSelect(e, 'invoice')} />
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => invGalleryRef.current.click()} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 py-2 rounded-lg text-xs font-semibold">
                      🖼️ Galería
                    </button>
                    <button onClick={() => invCamRef.current.click()} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white py-2 rounded-lg text-xs font-semibold">
                      📷 Cámara
                    </button>
                  </div>
                </div>

                <div className="border border-dashed border-slate-700 rounded-xl p-3 text-center bg-slate-950/40">
                  <p className="text-xs font-semibold text-slate-300 mb-2">⏲️ Foto del Odómetro (Tablero)</p>
                  {dashImg && (
                    <div className="mb-2">
                      <img src={dashImg} alt="Tablero" className="h-28 mx-auto rounded-lg object-cover border border-slate-700" />
                      <span className="text-[11px] text-emerald-400 font-medium">✓ Tablero listo</span>
                    </div>
                  )}
                  <input type="file" accept="image/*" ref={dashGalleryRef} className="hidden" onChange={(e) => handleImageSelect(e, 'dash')} />
                  <input type="file" accept="image/*" capture="environment" ref={dashCamRef} className="hidden" onChange={(e) => handleImageSelect(e, 'dash')} />
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => dashGalleryRef.current.click()} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-300 py-2 rounded-lg text-xs font-semibold">
                      🖼️ Galería
                    </button>
                    <button onClick={() => dashCamRef.current.click()} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white py-2 rounded-lg text-xs font-semibold">
                      📷 Cámara
                    </button>
                  </div>
                </div>

                <button
                  onClick={extractDataFromPhotos}
                  disabled={isScanning}
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-xs shadow-lg"
                >
                  {isScanning ? '⏳ Extrayendo datos con IA...' : '✨ Extraer Datos de las Fotos Automáticamente'}
                </button>

                {scanError && (
                  <div className="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-xs">
                    {scanError}
                  </div>
                )}
              </div>

              {/* PASO 2: MÉTODO DE PAGO */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
                <h2 className="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-2.5">
                  Paso 2: Tipo de Pago
                </h2>
                <div className="grid grid-cols-3 gap-2">
                  {['Tarjeta Primax', 'Tarjeta de Anthony', 'Efectivo'].map((metodo) => (
                    <button
                      key={metodo}
                      onClick={() => setForm({ ...form, metodoPago: metodo })}
                      className={`py-2.5 px-2 rounded-xl text-xs font-bold border transition ${
                        form.metodoPago === metodo
                          ? 'bg-cyan-600/30 border-cyan-400 text-white shadow'
                          : 'bg-slate-950 border-slate-800 text-slate-400'
                      }`}
                    >
                      {metodo === 'Efectivo' ? '💵 ' : '💳 '}
                      {metodo}
                    </button>
                  ))}
                </div>
              </div>

              {/* PASO 3: REVISIÓN Y EDICIÓN */}
              <div
                className={`bg-slate-900 rounded-2xl p-3.5 border transition ${
                  editHighlight ? 'border-amber-400 shadow-lg shadow-amber-500/10' : 'border-slate-800'
                }`}
              >
                <div className="flex items-center justify-between mb-2.5">
                  <h2 className="text-xs font-bold uppercase tracking-wider text-amber-400">
                    Paso 3: Revisar / Editar Datos y Subir
                  </h2>
                  <span className="text-[10px] text-slate-400">100% Editable</span>
                </div>

                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="text-[11px] text-slate-400">Fecha</label>
                    <input
                      type="text"
                      value={form.fecha}
                      onChange={(e) => setForm({ ...form, fecha: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400">Odómetro Actual (KM)</label>
                    <input
                      type="number"
                      step="any"
                      placeholder="Ej. 94499"
                      value={form.odometro}
                      onChange={(e) => setForm({ ...form, odometro: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400">Recorrido (Km)</label>
                    <input
                      type="number"
                      step="any"
                      placeholder={tripEfectivo > 0 ? String(tripEfectivo) : 'Ej. 280'}
                      value={form.recorrido}
                      onChange={(e) => setForm({ ...form, recorrido: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400">Galones Comprados</label>
                    <input
                      type="number"
                      step="any"
                      placeholder="Ej. 10.343"
                      value={form.galones}
                      onChange={(e) => setForm({ ...form, galones: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400">Costo Total ($)</label>
                    <input
                      type="number"
                      step="any"
                      placeholder="Ej. 56.77"
                      value={form.costoTotal}
                      onChange={(e) => setForm({ ...form, costoTotal: e.target.value })}
                      className="w-full bg-slate-950 border border-emerald-600/60 rounded-lg px-2.5 py-1.5 text-emerald-400 font-bold"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400">Tipo de Gasolina</label>
                    <select
                      value={form.tipoGasolina}
                      onChange={(e) => setForm({ ...form, tipoGasolina: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white"
                    >
                      <option value="Súper">Súper</option>
                      <option value="Extra / Ecopaís">Extra / Ecopaís</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400">No. Factura</label>
                    <input
                      type="text"
                      placeholder="200-000-000016162"
                      value={form.facturaNo}
                      onChange={(e) => setForm({ ...form, facturaNo: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400">Estación Gasolinera</label>
                    <input
                      type="text"
                      placeholder="ATIMASA S.A."
                      value={form.estacion}
                      onChange={(e) => setForm({ ...form, estacion: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-xs"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-4 gap-1.5 bg-slate-950 rounded-xl p-2.5 mt-3 border border-slate-800 text-center">
                  <div>
                    <p className="text-[10px] text-slate-400">Rendimiento</p>
                    <p className="text-xs font-bold text-cyan-400">{rendimientoReal} km/g</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-400">Costo/km</p>
                    <p className="text-xs font-bold text-white">${costoPorKm}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-400">Precio/Gal</p>
                    <p className="text-xs font-bold text-amber-300">${precioGalon}</p>
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-400">Próx. Mant.</p>
                    <p className="text-xs font-bold text-emerald-400">{kmRestantesMant.toLocaleString()} km</p>
                  </div>
                </div>

                <button
                  onClick={guardarYSubirASheets}
                  className="w-full mt-3 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg"
                >
                  ✅ Confirmar Datos y Subir a Google Sheets
                </button>
              </div>
            </div>
          )}

          {/* PESTAÑA 2: REPORTE MENSUAL */}
          {activeTab === 'reporte' && (
            <div className="space-y-3">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
                <h2 className="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-2.5">
                  💳 Gasto Acumulado por Tipo de Pago
                </h2>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                    <p className="text-[10px] text-slate-400">Tarjeta Primax</p>
                    <p className="text-sm font-bold text-cyan-400 mt-1">${totalPrimax.toFixed(2)}</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                    <p className="text-[10px] text-slate-400">Tarjeta Anthony</p>
                    <p className="text-sm font-bold text-amber-400 mt-1">${totalAnthony.toFixed(2)}</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                    <p className="text-[10px] text-slate-400">Efectivo</p>
                    <p className="text-sm font-bold text-emerald-400 mt-1">${totalEfectivo.toFixed(2)}</p>
                  </div>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                <h2 className="text-xs font-bold uppercase tracking-wider text-emerald-400">
                  📅 Presupuesto Mensual Proyectado
                </h2>
                <div className="flex justify-between text-xs py-1 border-b border-slate-800">
                  <span className="text-slate-400">Gasolina Súper proyectada (1,145 km/mes)</span>
                  <span className="font-bold text-white">${gastoGasolinaMensualProyectado.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-xs py-1 border-b border-slate-800">
                  <span className="text-slate-400">Parqueo mensual fijo</span>
                  <span className="font-bold text-white">${FIXED_PARKING.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-sm pt-1">
                  <span className="font-bold text-cyan-300">Total Mensual Estimado</span>
                  <span className="font-extrabold text-emerald-400">${presupuestoOperativoTotal.toFixed(2)}</span>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
                <h2 className="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">
                  🛠️ Próximo Mantenimiento (Meta: 102,000 km)
                </h2>
                <p className="text-xs text-slate-300">
                  Restan{' '}
                  <span className="font-bold text-white">
                    {ultimoRegistro
                      ? toNum(ultimoRegistro.kmMantenimiento).toLocaleString()
                      : '7,501'}{' '}
                    km
                  </span>{' '}
                  para el servicio preventivo en talleres INDUCORP.
                </p>
              </div>
            </div>
          )}

          {/* PESTAÑA 3: BASE GOOGLE SHEETS */}
          {activeTab === 'sheets' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-xs font-bold uppercase tracking-wider text-cyan-400">
                  Registros en Google Sheets ({records.length})
                </h2>
              </div>

              {records.length === 0 ? (
                <p className="text-xs text-slate-400 py-4 text-center">No hay registros cargados.</p>
              ) : (
                <div className="space-y-2">
                  {records.map((r, i) => (
                    <div key={r.id || i} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs space-y-1">
                      <div className="flex justify-between font-bold text-white">
                        <span>{r.fecha} • {toNum(r.odometro).toLocaleString()} km</span>
                        <span className="text-emerald-400">${toNum(r.costoTotal).toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between text-[11px] text-slate-400">
                        <span>{toNum(r.galones).toFixed(3)} gal (${toNum(r.precioGalon).toFixed(2)}/gal)</span>
                        <span className="text-amber-300 font-semibold">{r.metodoPago}</span>
                      </div>
                      <div className="flex justify-between text-[10px] text-slate-500">
                        <span>{r.estacion} ({r.facturaNo})</span>
                        <span>Mant. en {toNum(r.kmMantenimiento).toLocaleString()} km</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* MODAL DE CONFIGURACIÓN */}
          {showSyncModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-4 max-w-md w-full space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="font-bold text-sm text-cyan-400">⚙️ Conexión con Google Sheets e IA</h3>

                <div>
                  <label className="text-[11px] text-slate-300 block mb-1">
                    1. URL de tu Apps Script (Termina en /exec):
                  </label>
                  <input
                    type="text"
                    placeholder="https://script.google.com/macros/s/.../exec"
                    value={scriptUrl}
                    onChange={(e) => {
                      setScriptUrl(e.target.value);
                      localStorage.setItem('captiva_script_url', e.target.value);
                    }}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                  />
                </div>

                <div>
                  <label className="text-[11px] text-slate-300 block mb-1">
                    2. Gemini API Key (De aistudio.google.com/app/apikey):
                  </label>
                  <input
                    type="password"
                    placeholder="AIzaSy..."
                    value={geminiKey}
                    onChange={(e) => {
                      setGeminiKey(e.target.value);
                      localStorage.setItem('captiva_gemini_key', e.target.value);
                    }}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                  />
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-[11px] text-slate-400">Código Apps Script (14 columnas):</p>
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(codigoAppsScript);
                        setCopiedScript(true);
                        setTimeout(() => setCopiedScript(false), 2000);
                      }}
                      className="text-[11px] bg-cyan-600/30 border border-cyan-500/40 text-cyan-300 px-2 py-0.5 rounded-lg font-semibold"
                    >
                      {copiedScript ? '✓ Copiado' : '📋 Copiar código'}
                    </button>
                  </div>
                  <pre className="bg-slate-950 p-2 rounded-lg text-[10px] text-cyan-300 overflow-x-auto border border-slate-800 select-all">
                    {codigoAppsScript}
                  </pre>
                </div>

                <button
                  onClick={() => {
                    setShowSyncModal(false);
                    fetchFromGoogleSheets();
                  }}
                  className="w-full py-2.5 bg-cyan-600 text-white font-bold rounded-xl text-xs"
                >
                  Guardar y Refrescar Base
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

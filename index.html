    /* Tarjetas con acabado de cristal esmerilado y bordes sutiles */

      background: linear-gradient(160deg, rgba(36, 46, 73, 0.92) 0%, rgba(24, 26, 47, 0.96) 100%);

    /* Tarjeta Hero con la firma cromática de la paleta (#242E49 -> #54162B -> #B4182D) */

    /* Botón principal con degradado cálido Durazno -> Carmesí */

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const MAINTENANCE_GOAL = 102000;
    const MONTHLY_AVG_KM = 1145;
    const FIXED_PARKING = 48.88;
    const TIRE_ROTATION_INTERVAL = 5000;

    const DEFAULT_PARTS = [

      },
      {
        id: 'aceite-motor',
        nombre: 'Aceite Sintético 5W-30 + Filtro',

        especificacion: 'Sintético 5W-30 DEXOS1 Gen 2/3 (Lubricación Turbo)',
        estado: 'Al día',

        kmUltimoCambio: 92541,

      },
      {

        categoria: 'Frenos y Seguridad',

      },
      {

      },
      {
        id: 'bujias-iridio',

        categoria: 'Encendido',
        especificacion: 'Bujías de Iridio + Líquido de Frenos (Mant. Mayor 102k)',
        estado: 'Próximo',
        fechaUltimoCambio: '01/09/2026',
        kmUltimoCambio: 82000,
        kmProximoCambio: 102000,
        costoEstimado: 75.00,
        notas: 'Reemplazar en el mantenimiento mayor de 102,000 km'
      },
      {
        id: 'bateria-12v',
        nombre: 'Batería 12V',
        categoria: 'Sistema Eléctrico',
        especificacion: 'Revisión de voltaje y bornes',
        estado: 'Al día',
        fechaUltimoCambio: '01/09/2026',
        kmUltimoCambio: 92541,
        kmProximoCambio: 112000,
        costoEstimado: 135.00,
        notas: 'Operativa sin novedades'
      }
    ];

    const DEFAULT_KIT_ITEMS = [
      { id: 'extintor', nombre: 'Extintor de Incendios (10 lb / PQS)', categoria: 'Seguridad Vial RTV', vencimiento: '09/2027', estado: 'Vigente', listo: true },
      { id: 'triangulos', nombre: '2 Triángulos Reflectivos + Chaleco', categoria: 'Seguridad Vial RTV', vencimiento: 'Permanente', estado: 'Vigente', listo: true },
      { id: 'cables-llave', nombre: 'Cables de Corriente + Gata + Llave Cruz', categoria: 'Emergencia Mecánica', vencimiento: 'Permanente', estado: 'Vigente', listo: true },
      { id: 'antisepticos', nombre: 'Alcohol, Suero Fisiológico y Yodopovidona', categoria: 'Botiquín Curación', vencimiento: '10/2028', estado: 'Vigente', listo: true },
      { id: 'gasas-vendas', nombre: 'Gasas Estériles (10), Vendas (3" y 4"), Esparadrapo y Curitas', categoria: 'Botiquín Curación', vencimiento: '10/2029', estado: 'Vigente', listo: true },
      { id: 'instrumental', nombre: 'Guantes Nitrilo (2 pares), Tijera Punta Redonda, Pinza y Mascarillas', categoria: 'Botiquín Instrumental', vencimiento: '10/2029', estado: 'Vigente', listo: true },
      { id: 'medicamentos', nombre: 'Paracetamol, Ibuprofeno, Loratadina, Sales Rehidratación y Antiácido', categoria: 'Botiquín Medicamentos (Tabletas)', vencimiento: '06/2028', estado: 'Vigente', listo: true }
    ];

    const toNum = (val) => {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const n = parseFloat(String(val).replace(',', '.'));
      return isNaN(n) ? 0 : n;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('nuevo');
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('captiva_records_v5');
        return saved ? JSON.parse(saved) : [];
      });

      const [parts, setParts] = useState(() => {
        const saved = localStorage.getItem('captiva_parts_v2');
        return saved ? JSON.parse(saved) : DEFAULT_PARTS;
      });

      const [kitItems, setKitItems] = useState(() => {
        const saved = localStorage.getItem('captiva_kit_v1');
        return saved ? JSON.parse(saved) : DEFAULT_KIT_ITEMS;
      });

      const [savingsFund, setSavingsFund] = useState(() => {
        const saved = localStorage.getItem('captiva_savings_v1');
        return saved ? JSON.parse(saved) : { ahorrado: 40.00, meta: 300.00, ultimoAporte: '09/11/2026' };
      });
      const [customSavingInput, setCustomSavingInput] = useState('');

      const [filterPartStatus, setFilterPartStatus] = useState('Todas');
      const [showAddPartModal, setShowAddPartModal] = useState(false);
      const [editingPart, setEditingPart] = useState(null);
      const [partForm, setPartForm] = useState({
        nombre: '',
        categoria: 'Mantenimiento General',
        especificacion: '',
        estado: 'Al día',
        fechaUltimoCambio: new Date().toLocaleDateString('es-EC'),
        kmUltimoCambio: 94499,
        kmProximoCambio: 104499,
        kmUltimaRotacion: 94499,
        costoEstimado: '',
        notas: ''
      });

      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('captiva_script_url') || '');
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('captiva_gemini_key') || '');
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState('En línea');
      const [copiedScript, setCopiedScript] = useState(false);
      const [copiedText, setCopiedText] = useState('');

      const [invoiceImg, setInvoiceImg] = useState(null);
      const [dashImg, setDashImg] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [scanError, setScanError] = useState('');
      const [editHighlight, setEditHighlight] = useState(false);

      const [form, setForm] = useState({
        fecha: new Date().toLocaleDateString('es-EC'),
        odometro: '',
        recorrido: '',
        galones: '',
        tipoGasolina: 'Súper',
        subtotal: '',
        iva: '',
        costoTotal: '',
        metodoPago: 'Tarjeta Primax',
        facturaNo: '',
        estacion: '',
      });

      const invGalleryRef = useRef(null);
      const invCamRef = useRef(null);
      const dashGalleryRef = useRef(null);
      const dashCamRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('captiva_records_v5', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('captiva_parts_v2', JSON.stringify(parts));
      }, [parts]);

      useEffect(() => {
        localStorage.setItem('captiva_kit_v1', JSON.stringify(kitItems));
      }, [kitItems]);

      useEffect(() => {
        localStorage.setItem('captiva_savings_v1', JSON.stringify(savingsFund));
      }, [savingsFund]);

      const fetchFromGoogleSheets = async () => {
        if (!scriptUrl) return;
        setIsSyncing(true);
        setSyncStatus('Sincronizando...');
        try {
          const res = await fetch(scriptUrl + '?t=' + Date.now());
          const rawData = await res.json();
          const fuelRows = Array.isArray(rawData) ? rawData : (rawData.fuel || []);

          if (Array.isArray(fuelRows)) {
            const normalized = fuelRows.map((r, idx) => {
              const odo = toNum(r.odometro);
              const trip = toNum(r.recorrido);
              const gal = toNum(r.galones);
              const total = toNum(r.costoTotal);
              const pGal = toNum(r.precioGalon) || (gal > 0 ? Number((total / gal).toFixed(2)) : 0);
              const rend = toNum(r.rendimiento) || (gal > 0 && trip > 0 ? Number((trip / gal).toFixed(2)) : 0);
              const cKm = toNum(r.costoKm) || (trip > 0 && total > 0 ? Number((total / trip).toFixed(4)) : 0);
              const kmMant = toNum(r.kmMantenimiento) || Math.max(0, MAINTENANCE_GOAL - odo);
              return {
                ...r,
                id: r.id || idx,
                odometro: odo,
                recorrido: trip,
                galones: gal,
                costoTotal: total,
                precioGalon: pGal,
                rendimiento: rend,
                costoKm: cKm,
                kmMantenimiento: kmMant,
                metodoPago: r.metodoPago || 'Tarjeta Primax',
                facturaNo: r.facturaNo || 'S/N',
                estacion: r.estacion || 'EESS',
              };
            });
            setRecords(normalized);
          }
          setSyncStatus('Google Sheets Activo');
        } catch (err) {
          setSyncStatus('Modo Local');
        } finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        fetchFromGoogleSheets();
        const handleVisibility = () => {
          if (document.visibilityState === 'visible') fetchFromGoogleSheets();
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => document.removeEventListener('visibilitychange', handleVisibility);
      }, [scriptUrl, activeTab]);

      const ultimoRegistro = records.length > 0 ? records[0] : null;
      const odometroActualVehiculo = ultimoRegistro ? toNum(ultimoRegistro.odometro) : 94499;

      const syncExtraToSheet = async (payload) => {
        if (!scriptUrl) return;
        try {
          await fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
        } catch (e) {}
      };

      const registrarCambioHoy = (pieza) => {
        const esLlanta = pieza.id.includes('llanta') || pieza.nombre.toLowerCase().includes('llanta');
        const vidaUtilDefault = esLlanta ? 45000 : pieza.id.includes('pluma') ? 15000 : 10000;
        const nuevoKmProx = odometroActualVehiculo + vidaUtilDefault;
        const hoy = new Date().toLocaleDateString('es-EC');

        const actualizada = {
          ...pieza,
          estado: 'Al día',
          fechaUltimoCambio: hoy,
          kmUltimoCambio: odometroActualVehiculo,
          kmProximoCambio: nuevoKmProx,
          kmUltimaRotacion: odometroActualVehiculo,
          notas: esLlanta
            ? `4 llantas nuevas instaladas el ${hoy} (${odometroActualVehiculo.toLocaleString()} km). Próxima rotación a los ${(odometroActualVehiculo + TIRE_ROTATION_INTERVAL).toLocaleString()} km.`
            : `Cambiado el ${hoy} a los ${odometroActualVehiculo.toLocaleString()} km`
        };

        setParts((prev) => prev.map((p) => (p.id === pieza.id ? actualizada : p)));
        syncExtraToSheet({ action: 'save_part', part: actualizada });
      };

      const registrarRotacionLlantas = (pieza) => {
        const hoy = new Date().toLocaleDateString('es-EC');
        const actualizada = {
          ...pieza,
          kmUltimaRotacion: odometroActualVehiculo,
          notas: `Rotación y balanceo realizados el ${hoy} a los ${odometroActualVehiculo.toLocaleString()} km. Próxima a los ${(odometroActualVehiculo + TIRE_ROTATION_INTERVAL).toLocaleString()} km.`
        };
        setParts((prev) => prev.map((p) => (p.id === pieza.id ? actualizada : p)));
        syncExtraToSheet({ action: 'save_part', part: actualizada });
      };

      const guardarPiezaModal = () => {
        if (!partForm.nombre) {
          alert('Ingresa el nombre de la pieza o repuesto.');
          return;
        }
        const nuevaPieza = {
          ...partForm,
          id: editingPart ? editingPart.id : 'part-' + Date.now(),
          kmUltimoCambio: toNum(partForm.kmUltimoCambio) || odometroActualVehiculo,
          kmProximoCambio: toNum(partForm.kmProximoCambio) || (odometroActualVehiculo + 10000),
          kmUltimaRotacion: toNum(partForm.kmUltimaRotacion) || odometroActualVehiculo,
          costoEstimado: toNum(partForm.costoEstimado)
        };

        if (editingPart) {
          setParts((prev) => prev.map((p) => (p.id === editingPart.id ? nuevaPieza : p)));
        } else {
          setParts((prev) => [nuevaPieza, ...prev]);
        }

        syncExtraToSheet({ action: 'save_part', part: nuevaPieza });
        setShowAddPartModal(false);
        setEditingPart(null);
      };

      const abrirEditarPieza = (pieza) => {
        setEditingPart(pieza);
        setPartForm({
          nombre: pieza.nombre,
          categoria: pieza.categoria,
          especificacion: pieza.especificacion,
          estado: pieza.estado,
          fechaUltimoCambio: pieza.fechaUltimoCambio,
          kmUltimoCambio: pieza.kmUltimoCambio,
          kmProximoCambio: pieza.kmProximoCambio,
          kmUltimaRotacion: pieza.kmUltimaRotacion || pieza.kmUltimoCambio,
          costoEstimado: pieza.costoEstimado,
          notas: pieza.notas || ''
        });
        setShowAddPartModal(true);
      };

      const abonarAlFondo = (monto) => {
        const valor = toNum(monto);
        if (valor <= 0) return;
        const hoy = new Date().toLocaleDateString('es-EC');
        const nuevoSaldo = Math.max(0, Number((toNum(savingsFund.ahorrado) + valor).toFixed(2)));
        const actualizado = { ...savingsFund, ahorrado: nuevoSaldo, ultimoAporte: hoy };
        setSavingsFund(actualizado);
        setCustomSavingInput('');
        syncExtraToSheet({ action: 'save_fund', fund: actualizado });
      };

      const copiarDato = (texto, etiqueta) => {
        navigator.clipboard.writeText(texto);
        setCopiedText(etiqueta);
        setTimeout(() => setCopiedText(''), 2000);
      };

      const compressImage = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_SIZE = 1200;
              let width = img.width;
              let height = img.height;
              if (width > height && width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
              } else if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.78));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      };

      const handleImageSelect = async (e, type) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressed = await compressImage(file);
          if (type === 'invoice') setInvoiceImg(compressed);
          else setDashImg(compressed);
          setScanError('');
        } catch (err) {
          setScanError('No se pudo procesar la foto.');
        }
      };

      const extractDataFromPhotos = async () => {
        if (!invoiceImg && !dashImg) {
          setScanError('Selecciona primero la foto de la factura o del tablero.');
          return;
        }
        setIsScanning(true);
        setScanError('');

        if (!geminiKey) {
          setIsScanning(false);
          setEditHighlight(true);
          setScanError('Falta tu Gemini API Key en "⚙️ Sync". Agrégala o completa los datos en el Paso 3.');
          return;
        }

        try {
          const partsReq = [
            {
              text: `Analiza estas imágenes de una factura de gasolina de Ecuador y/o el tablero de una Chevrolet Captiva. Devuelve ÚNICAMENTE un JSON válido con esta estructura exacta (usa punto para decimales): {"fecha": "DD/MM/YYYY", "odometro": 0, "recorrido": 0, "galones": 0, "subtotal": 0, "iva": 0, "costoTotal": 0, "facturaNo": "", "estacion": ""}`
            }
          ];

          if (invoiceImg) {
            partsReq.push({ inline_data: { mime_type: 'image/jpeg', data: invoiceImg.split(',')[1] } });
          }
          if (dashImg) {
            partsReq.push({ inline_data: { mime_type: 'image/jpeg', data: dashImg.split(',')[1] } });
          }

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey.trim()}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: partsReq }] })
            }
          );

          const result = await response.json();
          if (result.error) throw new Error(result.error.message || 'API Key inválida');

          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('No se pudo leer el formato JSON');

          const parsed = JSON.parse(jsonMatch[0]);
          const lastOdo = records.length > 0 ? toNum(records[0].odometro) : 0;

          let calcTrip = parsed.recorrido ? toNum(parsed.recorrido) : '';

                </div>
              </div>
            </div>
          )}

          {/* PESTAÑA 5: BASE GOOGLE SHEETS */}
          {activeTab === 'sheets' && (
            <div className="premium-card rounded-3xl p-4 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-xs font-extrabold uppercase tracking-wider text-[#FDA481]">
                  🗂️ Historial en Google Sheets ({records.length})
                </h2>
              </div>

              {records.length === 0 ? (
                <p className="text-xs text-slate-400 py-6 text-center">No hay registros sincronizados aún.</p>
              ) : (
                <div className="space-y-2.5">
                  {records.map((r, i) => (
                    <div key={r.id || i} className="bg-[#181A2F] border border-[#37415C] rounded-2xl p-3 text-xs space-y-1">
                      <div className="flex justify-between font-bold text-white">
                        <span className="font-mono">{r.fecha} • {toNum(r.odometro).toLocaleString()} km</span>
                        <span className="text-[#FDA481] font-mono font-extrabold">${toNum(r.costoTotal).toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between text-[11px] text-slate-300">
                        <span className="font-mono">{toNum(r.galones).toFixed(3)} gal (${toNum(r.precioGalon).toFixed(2)}/gal)</span>
                        <span className="text-[#FDA481] font-semibold">{r.metodoPago}</span>
                      </div>
                      <div className="flex justify-between text-[10px] text-slate-400">
                        <span>{r.estacion} ({r.facturaNo})</span>
                        <span>Mant. en {toNum(r.kmMantenimiento).toLocaleString()} km</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* MODAL PARA AGREGAR O EDITAR PIEZA */}
          {showAddPartModal && (
            <div className="fixed inset-0 bg-[#181A2F]/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="premium-card rounded-3xl p-5 max-w-md w-full space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="font-extrabold text-sm text-[#FDA481]">
                  {editingPart ? '✏️ Editar Pieza / Repuesto' : '➕ Nueva Pieza del Inventario'}
                </h3>

                <div className="space-y-2.5">
                  <div>
                    <label className="text-[11px] text-slate-300">Nombre de la Pieza</label>
                    <input
                      type="text"
                      placeholder="Ej. Juego de 4 Llantas"
                      value={partForm.nombre}
                      onChange={(e) => setPartForm({ ...partForm, nombre: e.target.value })}
                      className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-slate-300">Estado Actual</label>
                      <select
                        value={partForm.estado}
                        onChange={(e) => setPartForm({ ...partForm, estado: e.target.value })}
                        className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                      >
                        <option value="Urgente">🚨 Urgente (Cambiar)</option>
                        <option value="Próximo">⏳ Próximo</option>
                        <option value="Al día">✓ Al día</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-300">Fecha Último Cambio</label>
                      <input
                        type="text"
                        value={partForm.fechaUltimoCambio}
                        onChange={(e) => setPartForm({ ...partForm, fechaUltimoCambio: e.target.value })}
                        className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-300">Medida / Especificación Técnica</label>
                    <input
                      type="text"
                      placeholder='Ej. 215/60 R17 o Piloto 24" / Copiloto 16"'
                      value={partForm.especificacion}
                      onChange={(e) => setPartForm({ ...partForm, especificacion: e.target.value })}
                      className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[11px] text-slate-300">Km Últ. Cambio</label>
                      <input
                        type="number"
                        value={partForm.kmUltimoCambio}
                        onChange={(e) => setPartForm({ ...partForm, kmUltimoCambio: e.target.value })}
                        className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-2.5 py-2 text-xs text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-300">Km Próx. Cambio</label>
                      <input
                        type="number"
                        value={partForm.kmProximoCambio}
                        onChange={(e) => setPartForm({ ...partForm, kmProximoCambio: e.target.value })}
                        className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-2.5 py-2 text-xs text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-300">Costo Est. ($)</label>
                      <input
                        type="number"
                        step="any"
                        value={partForm.costoEstimado}
                        onChange={(e) => setPartForm({ ...partForm, costoEstimado: e.target.value })}
                        className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-2.5 py-2 text-xs text-white font-mono"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-300">Notas / Marca / Taller</label>
                    <input
                      type="text"
                      placeholder="Ej. Cambiadas hace 2 semanas"
                      value={partForm.notas}
                      onChange={(e) => setPartForm({ ...partForm, notas: e.target.value })}
                      className="w-full mt-1 bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2.5 pt-2">
                  <button
                    onClick={() => setShowAddPartModal(false)}
                    className="py-2.5 btn-slate text-slate-200 font-bold rounded-2xl text-xs"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={guardarPiezaModal}
                    className="py-2.5 btn-sunset text-white font-extrabold rounded-2xl text-xs"
                  >
                    Guardar Pieza
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE CONFIGURACIÓN SYNC */}
          {showSyncModal && (
            <div className="fixed inset-0 bg-[#181A2F]/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="premium-card rounded-3xl p-5 max-w-md w-full space-y-3.5 max-h-[90vh] overflow-y-auto">
                <h3 className="font-extrabold text-sm text-[#FDA481]">⚙️ Conexión Google Sheets & Gemini IA</h3>

                <div>
                  <label className="text-[11px] text-slate-300 block mb-1">
                    1. URL de tu Apps Script (Termina en /exec):
                  </label>
                  <input
                    type="text"
                    placeholder="https://script.google.com/macros/s/.../exec"
                    value={scriptUrl}
                    onChange={(e) => {
                      setScriptUrl(e.target.value);
                      localStorage.setItem('captiva_script_url', e.target.value);
                    }}
                    className="w-full bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>

                <div>
                  <label className="text-[11px] text-slate-300 block mb-1">
                    2. Gemini API Key (aistudio.google.com/app/apikey):
                  </label>
                  <input
                    type="password"
                    placeholder="AIzaSy..."
                    value={geminiKey}
                    onChange={(e) => {
                      setGeminiKey(e.target.value);
                      localStorage.setItem('captiva_gemini_key', e.target.value);
                    }}
                    className="w-full bg-[#181A2F] border border-[#37415C] rounded-xl px-3 py-2 text-xs text-white"
                  />
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <p className="text-[11px] text-slate-300">Código Apps Script (16 cols + Piezas + Alcancía):</p>
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(codigoAppsScript);
                        setCopiedScript(true);
                        setTimeout(() => setCopiedScript(false), 2000);
                      }}
                      className="text-[11px] bg-[#54162B] border border-[#FDA481]/50 text-[#FDA481] px-2.5 py-1 rounded-xl font-bold"
                    >
                      {copiedScript ? '✓ Copiado' : '📋 Copiar código'}
                    </button>
                  </div>
                  <pre className="bg-[#181A2F] p-2.5 rounded-2xl text-[10px] text-[#FDA481] overflow-x-auto border border-[#37415C] select-all font-mono">
                    {codigoAppsScript}
                  </pre>
                </div>

                <button
                  onClick={() => {
                    setShowSyncModal(false);
                    fetchFromGoogleSheets();
                  }}
                  className="w-full py-3 btn-sunset text-white font-extrabold rounded-2xl text-xs"
                >
                  Guardar y Sincronizar Base
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

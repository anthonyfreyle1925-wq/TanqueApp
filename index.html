<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Configuración PWA para iPhone a pantalla completa -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Captiva LT" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933939.png" />

  <title>Captiva LT 1.5 Turbo - Control & Inventario</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input, select, button {
      font-size: 16px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const MAINTENANCE_GOAL = 102000;
    const MONTHLY_AVG_KM = 1145;
    const FIXED_PARKING = 48.88;

    const DEFAULT_PARTS = [
      {
        id: 'llantas-4',
        nombre: 'Juego de 4 Llantas',
        categoria: 'Neumáticos y Suspensión',
        especificacion: 'Medida 215/60 R17 (Presión 32-35 PSI)',
        estado: 'Urgente',
        fechaUltimoCambio: 'Pendiente de cambio',
        kmUltimoCambio: 50000,
        kmProximoCambio: 94499,
        costoEstimado: 420.00,
        notas: 'Cambiar las 4 llantas + alineación y balanceo'
      },
      {
        id: 'plumas-limpia',
        nombre: 'Plumas Limpiaparabrisas (Juego)',
        categoria: 'Visibilidad y Exterior',
        especificacion: 'Piloto 24" (600mm) • Copiloto 16" (400mm) • Trasera 10" (J-Hook)',
        estado: 'Al día',
        fechaUltimoCambio: '26/10/2026',
        kmUltimoCambio: 93800,
        kmProximoCambio: 108800,
        costoEstimado: 28.00,
        notas: 'Cambiadas hace 2 semanas'
      },
      {
        id: 'aceite-motor',
        nombre: 'Aceite Sintético 5W-30 + Filtro',
        categoria: 'Motor 1.5 Turbo',
        especificacion: 'Sintético 5W-30 DEXOS1 Gen 2/3 (Lubricación Turbo)',
        estado: 'Al día',
        fechaUltimoCambio: '01/09/2026',
        kmUltimoCambio: 92541,
        kmProximoCambio: 102000,
        costoEstimado: 85.00,
        notas: 'Servicio en talleres INDUCORP'
      },
      {
        id: 'pastillas-freno',
        nombre: 'Pastillas de Freno (Delanteras y Post.)',
        categoria: 'Frenos y Seguridad',
        especificacion: 'Inspección y limpieza cada 10,000 km',
        estado: 'Al día',
        fechaUltimoCambio: '01/09/2026',
        kmUltimoCambio: 92541,
        kmProximoCambio: 102000,
        costoEstimado: 95.00,
        notas: 'Revisadas en último mantenimiento general'
      },
      {
        id: 'filtros-aire-cabina',
        nombre: 'Filtro de Aire Motor + Filtro Cabina A/C',
        categoria: 'Climatización y Admisión',
        especificacion: 'Cambio cada 10,000 km por clima de Guayaquil',
        estado: 'Al día',
        fechaUltimoCambio: '01/09/2026',
        kmUltimoCambio: 92541,
        kmProximoCambio: 102000,
        costoEstimado: 45.00,
        notas: 'Esencial para enfriamiento del A/C y cuidado del turbo'
      },
      {
        id: 'bujias-iridio',
        nombre: 'Juego de 4 Bujías (Motor Turbo)',
        categoria: 'Encendido',
        especificacion: 'Bujías de Iridio (Mantenimiento Mayor 100k)',
        estado: 'Próximo',
        fechaUltimoCambio: '01/09/2026',
        kmUltimoCambio: 82000,
        kmProximoCambio: 102000,
        costoEstimado: 75.00,
        notas: 'Revisar/reemplazar en el mantenimiento de 102,000 km'
      },
      {
        id: 'bateria-12v',
        nombre: 'Batería 12V',
        categoria: 'Sistema Eléctrico',
        especificacion: ' Revisión de voltaje y bornes',
        estado: 'Al día',
        fechaUltimoCambio: '01/09/2026',
        kmUltimoCambio: 92541,
        kmProximoCambio: 112000,
        costoEstimado: 135.00,
        notas: 'Operativa sin novedades'
      }
    ];

    const toNum = (val) => {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const n = parseFloat(String(val).replace(',', '.'));
      return isNaN(n) ? 0 : n;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('nuevo');
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('captiva_records_v4');
        return saved ? JSON.parse(saved) : [];
      });

      const [parts, setParts] = useState(() => {
        const saved = localStorage.getItem('captiva_parts_v1');
        return saved ? JSON.parse(saved) : DEFAULT_PARTS;
      });

      const [filterPartStatus, setFilterPartStatus] = useState('Todas');
      const [showAddPartModal, setShowAddPartModal] = useState(false);
      const [editingPart, setEditingPart] = useState(null);
      const [partForm, setPartForm] = useState({
        nombre: '',
        categoria: 'Mantenimiento General',
        especificacion: '',
        estado: 'Al día',
        fechaUltimoCambio: new Date().toLocaleDateString('es-EC'),
        kmUltimoCambio: 94499,
        kmProximoCambio: 104499,
        costoEstimado: '',
        notas: ''
      });

      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('captiva_script_url') || '');
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('captiva_gemini_key') || '');
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Listo');
      const [copiedScript, setCopiedScript] = useState(false);

      const [invoiceImg, setInvoiceImg] = useState(null);
      const [dashImg, setDashImg] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [scanError, setScanError] = useState('');
      const [editHighlight, setEditHighlight] = useState(false);

      const [form, setForm] = useState({
        fecha: new Date().toLocaleDateString('es-EC'),
        odometro: '',
        recorrido: '',
        galones: '',
        tipoGasolina: 'Súper',
        subtotal: '',
        iva: '',
        costoTotal: '',
        metodoPago: 'Tarjeta Primax',
        facturaNo: '',
        estacion: '',
      });

      const invGalleryRef = useRef(null);
      const invCamRef = useRef(null);
      const dashGalleryRef = useRef(null);
      const dashCamRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('captiva_records_v4', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('captiva_parts_v1', JSON.stringify(parts));
      }, [parts]);

      const fetchFromGoogleSheets = async () => {
        if (!scriptUrl) return;
        setIsSyncing(true);
        setSyncStatus('Consultando Google Sheets...');
        try {
          const res = await fetch(scriptUrl + '?t=' + Date.now());
          const rawData = await res.json();
          const fuelRows = Array.isArray(rawData) ? rawData : (rawData.fuel || []);
          const sheetParts = rawData.parts || [];

          if (Array.isArray(fuelRows)) {
            const normalized = fuelRows.map((r, idx) => {
              const odo = toNum(r.odometro);
              const trip = toNum(r.recorrido);
              const gal = toNum(r.galones);
              const total = toNum(r.costoTotal);
              const pGal = toNum(r.precioGalon) || (gal > 0 ? Number((total / gal).toFixed(2)) : 0);
              const rend = toNum(r.rendimiento) || (gal > 0 && trip > 0 ? Number((trip / gal).toFixed(2)) : 0);
              const cKm = toNum(r.costoKm) || (trip > 0 && total > 0 ? Number((total / trip).toFixed(4)) : 0);
              const kmMant = toNum(r.kmMantenimiento) || Math.max(0, MAINTENANCE_GOAL - odo);
              return {
                ...r,
                id: r.id || idx,
                odometro: odo,
                recorrido: trip,
                galones: gal,
                costoTotal: total,
                precioGalon: pGal,
                rendimiento: rend,
                costoKm: cKm,
                kmMantenimiento: kmMant,
                metodoPago: r.metodoPago || 'Tarjeta Primax',
                facturaNo: r.facturaNo || 'S/N',
                estacion: r.estacion || 'EESS',
              };
            });
            setRecords(normalized);
          }
          if (Array.isArray(sheetParts) && sheetParts.length > 0) {
            setParts(sheetParts);
          }
          setSyncStatus('Sincronizado con Google Sheets');
        } catch (err) {
          setSyncStatus('Usando copia local');
        } finally {
          setIsSyncing(false);
        }
      };

      useEffect(() => {
        fetchFromGoogleSheets();
        const handleVisibility = () => {
          if (document.visibilityState === 'visible') fetchFromGoogleSheets();
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => document.removeEventListener('visibilitychange', handleVisibility);
      }, [scriptUrl, activeTab]);

      const ultimoRegistro = records.length > 0 ? records[0] : null;
      const odometroActualVehiculo = ultimoRegistro ? toNum(ultimoRegistro.odometro) : 94499;

      // Guardar pieza en local y enviar a Google Sheets
      const syncPartToSheet = async (partObj) => {
        if (!scriptUrl) return;
        try {
          await fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'save_part', part: partObj }),
          });
        } catch (e) {}
      };

      const registrarCambioHoy = (pieza) => {
        const vidaUtilDefault = pieza.id.includes('llanta') ? 45000 : pieza.id.includes('pluma') ? 15000 : 10000;
        const nuevoKmProx = odometroActualVehiculo + vidaUtilDefault;
        const hoy = new Date().toLocaleDateString('es-EC');

        const actualizada = {
          ...pieza,
          estado: 'Al día',
          fechaUltimoCambio: hoy,
          kmUltimoCambio: odometroActualVehiculo,
          kmProximoCambio: nuevoKmProx,
          notas: `Cambiado el ${hoy} a los ${odometroActualVehiculo.toLocaleString()} km`
        };

        setParts((prev) => prev.map((p) => (p.id === pieza.id ? actualizada : p)));
        syncPartToSheet(actualizada);
      };

      const guardarPiezaModal = () => {
        if (!partForm.nombre) {
          alert('Ingresa el nombre de la pieza o repuesto.');
          return;
        }
        const nuevaPieza = {
          ...partForm,
          id: editingPart ? editingPart.id : 'part-' + Date.now(),
          kmUltimoCambio: toNum(partForm.kmUltimoCambio) || odometroActualVehiculo,
          kmProximoCambio: toNum(partForm.kmProximoCambio) || (odometroActualVehiculo + 10000),
          costoEstimado: toNum(partForm.costoEstimado)
        };

        if (editingPart) {
          setParts((prev) => prev.map((p) => (p.id === editingPart.id ? nuevaPieza : p)));
        } else {
          setParts((prev) => [nuevaPieza, ...prev]);
        }

        syncPartToSheet(nuevaPieza);
        setShowAddPartModal(false);
        setEditingPart(null);
      };

      const abrirEditarPieza = (pieza) => {
        setEditingPart(pieza);
        setPartForm({
          nombre: pieza.nombre,
          categoria: pieza.categoria,
          especificacion: pieza.especificacion,
          estado: pieza.estado,
          fechaUltimoCambio: pieza.fechaUltimoCambio,
          kmUltimoCambio: pieza.kmUltimoCambio,
          kmProximoCambio: pieza.kmProximoCambio,
          costoEstimado: pieza.costoEstimado,
          notas: pieza.notas || ''
        });
        setShowAddPartModal(true);
      };

      const compressImage = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_SIZE = 1200;
              let width = img.width;
              let height = img.height;
              if (width > height && width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
              } else if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.78));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      };

      const handleImageSelect = async (e, type) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressed = await compressImage(file);
          if (type === 'invoice') setInvoiceImg(compressed);
          else setDashImg(compressed);
          setScanError('');
        } catch (err) {
          setScanError('No se pudo procesar la foto.');
        }
      };

      const extractDataFromPhotos = async () => {
        if (!invoiceImg && !dashImg) {
          setScanError('Selecciona primero la foto de la factura o del tablero.');
          return;
        }
        setIsScanning(true);
        setScanError('');

        if (!geminiKey) {
          setIsScanning(false);
          setEditHighlight(true);
          setScanError('Falta tu Gemini API Key en "⚙️ Configurar Sync". Agrégala o completa los datos en el Paso 3.');
          return;
        }

        try {
          const partsReq = [
            {
              text: `Analiza estas imágenes de una factura de gasolina de Ecuador y/o el tablero de una Chevrolet Captiva. Devuelve ÚNICAMENTE un JSON válido con esta estructura exacta (usa punto para decimales): {"fecha": "DD/MM/YYYY", "odometro": 0, "recorrido": 0, "galones": 0, "subtotal": 0, "iva": 0, "costoTotal": 0, "facturaNo": "", "estacion": ""}`
            }
          ];

          if (invoiceImg) {
            partsReq.push({ inline_data: { mime_type: 'image/jpeg', data: invoiceImg.split(',')[1] } });
          }
          if (dashImg) {
            partsReq.push({ inline_data: { mime_type: 'image/jpeg', data: dashImg.split(',')[1] } });
          }

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey.trim()}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: partsReq }] })
            }
          );

          const result = await response.json();
          if (result.error) throw new Error(result.error.message || 'API Key inválida');

          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('No se pudo leer el formato JSON');

          const parsed = JSON.parse(jsonMatch[0]);
          const lastOdo = records.length > 0 ? toNum(records[0].odometro) : 0;
          const newOdo = parsed.odometro ? toNum(parsed.odometro) : '';
          let calcTrip = parsed.recorrido ? toNum(parsed.recorrido) : '';

          if (lastOdo > 0 && newOdo > lastOdo && (!calcTrip || calcTrip === 0 || calcTrip > (newOdo - lastOdo) * 1.4)) {
            calcTrip = Number((newOdo - lastOdo).toFixed(1));
          }

          const totalExtraido = parsed.costoTotal ? toNum(parsed.costoTotal) : '';
          const subExtraido = parsed.subtotal ? toNum(parsed.subtotal) : (totalExtraido ? Number((totalExtraido / 1.15).toFixed(2)) : '');
          const ivaExtraido = parsed.iva ? toNum(parsed.iva) : (totalExtraido && subExtraido ? Number((totalExtraido - subExtraido).toFixed(2)) : '');

          setForm((prev) => ({
            ...prev,
            fecha: parsed.fecha || prev.fecha,
            odometro: newOdo !== '' ? newOdo : prev.odometro,
            recorrido: calcTrip !== '' ? calcTrip : prev.recorrido,
            galones: parsed.galones ? toNum(parsed.galones) : prev.galones,
            subtotal: subExtraido !== '' ? subExtraido : prev.subtotal,
            iva: ivaExtraido !== '' ? ivaExtraido : prev.iva,
            costoTotal: totalExtraido !== '' ? totalExtraido : prev.costoTotal,
            facturaNo: parsed.facturaNo || prev.facturaNo,
            estacion: parsed.estacion || prev.estacion,
          }));
          setEditHighlight(true);
        } catch (err) {
          setScanError('Detalle IA: ' + err.message + '. Puedes editar los campos directamente en el Paso 3.');
          setEditHighlight(true);
        } finally {
          setIsScanning(false);
        }
      };

      const odoNum = toNum(form.odometro);
      const tripInput = toNum(form.recorrido);
      const tripEfectivo =
        tripInput > 0
          ? tripInput
          : ultimoRegistro && odoNum > toNum(ultimoRegistro.odometro)
          ? Number((odoNum - toNum(ultimoRegistro.odometro)).toFixed(1))
          : 0;

      const galNum = toNum(form.galones);
      const totalNum = toNum(form.costoTotal);

      const rendimientoReal = galNum > 0 && tripEfectivo > 0 ? (tripEfectivo / galNum).toFixed(2) : '0.00';
      const costoPorKm = tripEfectivo > 0 && totalNum > 0 ? (totalNum / tripEfectivo).toFixed(4) : '0.0000';
      const precioGalon = galNum > 0 && totalNum > 0 ? (totalNum / galNum).toFixed(2) : '0.00';
      const kmRestantesMant = odoNum > 0 ? Math.max(0, MAINTENANCE_GOAL - odoNum) : MAINTENANCE_GOAL;

      const guardarYSubirASheets = async () => {
        if (!odoNum || !galNum || !totalNum) {
          alert('Verifica que Odómetro, Galones y Costo Total tengan valores en el Paso 3.');
          return;
        }

        const subNum = toNum(form.subtotal) || Number((totalNum / 1.15).toFixed(2));
        const ivaNum = toNum(form.iva) || Number((totalNum - subNum).toFixed(2));

        const nuevoRegistro = {
          action: 'save_fuel',
          id: Date.now(),
          fecha: form.fecha,
          odometro: odoNum,
          recorrido: tripEfectivo,
          galones: galNum,
          tipoGasolina: form.tipoGasolina,
          costoTotal: totalNum,
          precioGalon: toNum(precioGalon),
          subtotal: subNum,
          iva: ivaNum,
          metodoPago: form.metodoPago,
          kmMantenimiento: kmRestantesMant,
          facturaNo: form.facturaNo || 'S/N',
          estacion: form.estacion || 'ATIMASA / Primax',
          rendimiento: toNum(rendimientoReal),
          costoKm: toNum(costoPorKm),
        };

        setRecords([nuevoRegistro, ...records]);

        if (scriptUrl) {
          setIsSyncing(true);
          setSyncStatus('Subiendo a Google Sheets...');
          try {
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(nuevoRegistro),
            });
            setSyncStatus('¡Guardado en Google Sheets!');
            setTimeout(() => fetchFromGoogleSheets(), 1400);
          } catch (e) {
            setSyncStatus('Guardado local');
          } finally {
            setIsSyncing(false);
          }
        }

        setInvoiceImg(null);
        setDashImg(null);
        setEditHighlight(false);
        setForm((prev) => ({
          ...prev,
          odometro: '',
          recorrido: '',
          galones: '',
          subtotal: '',
          iva: '',
          costoTotal: '',
          facturaNo: '',
          estacion: '',
        }));
        alert('✅ Tanqueo guardado en las 16 columnas de tu Google Sheet.');
      };

      const totalPrimax = records
        .filter((r) => r.metodoPago === 'Tarjeta Primax')
        .reduce((acc, r) => acc + toNum(r.costoTotal), 0);
      const totalAnthony = records
        .filter((r) => r.metodoPago === 'Tarjeta de Anthony')
        .reduce((acc, r) => acc + toNum(r.costoTotal), 0);
      const totalEfectivo = records
        .filter((r) => r.metodoPago === 'Efectivo')
        .reduce((acc, r) => acc + toNum(r.costoTotal), 0);

      const registrosConCostoKm = records.filter((r) => toNum(r.costoKm) > 0);
      const costoKmPromedio =
        registrosConCostoKm.length > 0
          ? registrosConCostoKm.reduce((acc, r) => acc + toNum(r.costoKm), 0) / registrosConCostoKm.length
          : 0.2065;
      const gastoGasolinaMensualProyectado = costoKmPromedio * MONTHLY_AVG_KM;
      const presupuestoOperativoTotal = gastoGasolinaMensualProyectado + FIXED_PARKING;

      const piezasUrgentesCount = parts.filter((p) => p.estado === 'Urgente').length;
      const filteredParts = filterPartStatus === 'Todas' ? parts : parts.filter((p) => p.estado === filterPartStatus);

      const codigoAppsScript = `function toNum(val) {
  if (typeof val === 'number') return val;
  if (!val) return 0;
  var clean = String(val).replace(/\\$/g, '').replace(/\\s/g, '').replace(',', '.');
  var n = parseFloat(clean);
  return isNaN(n) ? 0 : n;
}
function formatDate(val) {
  if (!val) return "";
  if (Object.prototype.toString.call(val) === '[object Date]') {
    return Utilities.formatDate(val, Session.getScriptTimeZone(), "dd/MM/yyyy");
  }
  return String(val);
}
function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheets()[0];
  var rows = sheet.getDataRange().getValues();
  var fuel = [];
  if (rows.length > 1) {
    for (var i = rows.length - 1; i >= 1; i--) {
      var r = rows[i];
      if (!r[0] && !r[1]) continue;
      var recorrido = toNum(r[2]);
      var galones = toNum(r[3]);
      var costoTotal = toNum(r[5]);
      var precioGalon = toNum(r[6]) || (galones > 0 ? Number((costoTotal / galones).toFixed(2)) : 0);
      var rendimiento = toNum(r[14]) || ((galones > 0 && recorrido > 0) ? Number((recorrido / galones).toFixed(2)) : 0);
      var costoKm = toNum(r[15]) || ((recorrido > 0 && costoTotal > 0) ? Number((costoTotal / recorrido).toFixed(4)) : 0);
      fuel.push({
        id: i, fecha: formatDate(r[0]), odometro: toNum(r[1]), recorrido: recorrido,
        galones: galones, tipoGasolina: r[4] || "Súper", costoTotal: costoTotal,
        precioGalon: precioGalon, subtotal: toNum(r[7]), iva: toNum(r[8]),
        metodoPago: r[9] || "Tarjeta Primax", kmMantenimiento: toNum(r[10]),

                        >
                          ✏️ Editar / Estado
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* PESTAÑA 3: REPORTE MENSUAL */}
          {activeTab === 'reporte' && (
            <div className="space-y-3">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
                <h2 className="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-2.5">
                  💳 Gasto Acumulado por Tipo de Pago
                </h2>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                    <p className="text-[10px] text-slate-400">Tarjeta Primax</p>
                    <p className="text-sm font-bold text-cyan-400 mt-1">${totalPrimax.toFixed(2)}</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                    <p className="text-[10px] text-slate-400">Tarjeta Anthony</p>
                    <p className="text-sm font-bold text-amber-400 mt-1">${totalAnthony.toFixed(2)}</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                    <p className="text-[10px] text-slate-400">Efectivo</p>
                    <p className="text-sm font-bold text-emerald-400 mt-1">${totalEfectivo.toFixed(2)}</p>
                  </div>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                <h2 className="text-xs font-bold uppercase tracking-wider text-emerald-400">
                  📅 Presupuesto Mensual Proyectado
                </h2>
                <div className="flex justify-between text-xs py-1 border-b border-slate-800">
                  <span className="text-slate-400">Gasolina Súper proyectada (1,145 km/mes)</span>
                  <span className="font-bold text-white">${gastoGasolinaMensualProyectado.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-xs py-1 border-b border-slate-800">
                  <span className="text-slate-400">Parqueo mensual fijo</span>
                  <span className="font-bold text-white">${FIXED_PARKING.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-sm pt-1">
                  <span className="font-bold text-cyan-300">Total Mensual Estimado</span>
                  <span className="font-extrabold text-emerald-400">${presupuestoOperativoTotal.toFixed(2)}</span>
                </div>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5">
                <h2 className="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">
                  🛠️ Próximo Mantenimiento (Meta: 102,000 km)
                </h2>
                <p className="text-xs text-slate-300">
                  Restan{' '}
                  <span className="font-bold text-white">
                    {ultimoRegistro
                      ? toNum(ultimoRegistro.kmMantenimiento).toLocaleString()
                      : '7,501'}{' '}
                    km
                  </span>{' '}
                  para el servicio preventivo en talleres INDUCORP.
                </p>
              </div>
            </div>
          )}

          {/* PESTAÑA 4: BASE GOOGLE SHEETS */}
          {activeTab === 'sheets' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-xs font-bold uppercase tracking-wider text-cyan-400">
                  Registros en Google Sheets ({records.length})
                </h2>
              </div>

              {records.length === 0 ? (
                <p className="text-xs text-slate-400 py-4 text-center">No hay registros cargados.</p>
              ) : (
                <div className="space-y-2">
                  {records.map((r, i) => (
                    <div key={r.id || i} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs space-y-1">
                      <div className="flex justify-between font-bold text-white">
                        <span>{r.fecha} • {toNum(r.odometro).toLocaleString()} km</span>
                        <span className="text-emerald-400">${toNum(r.costoTotal).toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between text-[11px] text-slate-400">
                        <span>{toNum(r.galones).toFixed(3)} gal (${toNum(r.precioGalon).toFixed(2)}/gal)</span>
                        <span className="text-amber-300 font-semibold">{r.metodoPago}</span>
                      </div>
                      <div className="flex justify-between text-[10px] text-slate-500">
                        <span>{r.estacion} ({r.facturaNo})</span>
                        <span>Mant. en {toNum(r.kmMantenimiento).toLocaleString()} km</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* MODAL PARA AGREGAR O EDITAR PIEZA DEL INVENTARIO */}
          {showAddPartModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-4 max-w-md w-full space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="font-bold text-sm text-cyan-400">
                  {editingPart ? '✏️ Editar Pieza / Repuesto' : '➕ Agregar Pieza al Inventario'}
                </h3>

                <div className="space-y-2">
                  <div>
                    <label className="text-[11px] text-slate-300">Nombre de la Pieza</label>
                    <input
                      type="text"
                      placeholder="Ej. Juego de 4 Llantas"
                      value={partForm.nombre}
                      onChange={(e) => setPartForm({ ...partForm, nombre: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[11px] text-slate-300">Estado Actual</label>
                      <select
                        value={partForm.estado}
                        onChange={(e) => setPartForm({ ...partForm, estado: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                      >
                        <option value="Urgente">🚨 Urgente (Cambiar)</option>
                        <option value="Próximo">⚠️ Próximo</option>
                        <option value="Al día">✅ Al día</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-300">Fecha Último Cambio</label>
                      <input
                        type="text"
                        value={partForm.fechaUltimoCambio}
                        onChange={(e) => setPartForm({ ...partForm, fechaUltimoCambio: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-300">Medida / Especificación Técnica</label>
                    <input
                      type="text"
                      placeholder='Ej. 215/60 R17 o Piloto 24" / Copiloto 16"'
                      value={partForm.especificacion}
                      onChange={(e) => setPartForm({ ...partForm, especificacion: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                    />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[11px] text-slate-300">Km Últ. Cambio</label>
                      <input
                        type="number"
                        value={partForm.kmUltimoCambio}
                        onChange={(e) => setPartForm({ ...partForm, kmUltimoCambio: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-300">Km Próx. Cambio</label>
                      <input
                        type="number"
                        value={partForm.kmProximoCambio}
                        onChange={(e) => setPartForm({ ...partForm, kmProximoCambio: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-slate-300">Costo Est. ($)</label>
                      <input
                        type="number"
                        step="any"
                        value={partForm.costoEstimado}
                        onChange={(e) => setPartForm({ ...partForm, costoEstimado: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-300">Notas / Marca / Taller</label>
                    <input
                      type="text"
                      placeholder="Ej. Cambiadas hace 2 semanas"
                      value={partForm.notas}
                      onChange={(e) => setPartForm({ ...partForm, notas: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button
                    onClick={() => setShowAddPartModal(false)}
                    className="py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={guardarPiezaModal}
                    className="py-2.5 bg-cyan-600 text-white font-bold rounded-xl text-xs"
                  >
                    Guardar Pieza
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL DE CONFIGURACIÓN SYNC */}
          {showSyncModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-4 max-w-md w-full space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="font-bold text-sm text-cyan-400">⚙️ Conexión con Google Sheets e IA</h3>

                <div>
                  <label className="text-[11px] text-slate-300 block mb-1">
                    1. URL de tu Apps Script (Termina en /exec):
                  </label>
                  <input
                    type="text"
                    placeholder="https://script.google.com/macros/s/.../exec"
                    value={scriptUrl}
                    onChange={(e) => {
                      setScriptUrl(e.target.value);
                      localStorage.setItem('captiva_script_url', e.target.value);
                    }}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                  />
                </div>

                <div>
                  <label className="text-[11px] text-slate-300 block mb-1">
                    2. Gemini API Key (De aistudio.google.com/app/apikey):
                  </label>
                  <input
                    type="password"
                    placeholder="AIzaSy..."
                    value={geminiKey}
                    onChange={(e) => {
                      setGeminiKey(e.target.value);
                      localStorage.setItem('captiva_gemini_key', e.target.value);
                    }}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white"
                  />
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-[11px] text-slate-400">Código Apps Script (Tanqueos + Inventario Piezas):</p>
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(codigoAppsScript);
                        setCopiedScript(true);
                        setTimeout(() => setCopiedScript(false), 2000);
                      }}
                      className="text-[11px] bg-cyan-600/30 border border-cyan-500/40 text-cyan-300 px-2 py-0.5 rounded-lg font-semibold"
                    >
                      {copiedScript ? '✓ Copiado' : '📋 Copiar código'}
                    </button>
                  </div>
                  <pre className="bg-slate-950 p-2 rounded-lg text-[10px] text-cyan-300 overflow-x-auto border border-slate-800 select-all">
                    {codigoAppsScript}
                  </pre>
                </div>

                <button
                  onClick={() => {
                    setShowSyncModal(false);
                    fetchFromGoogleSheets();
                  }}
                  className="w-full py-2.5 bg-cyan-600 text-white font-bold rounded-xl text-xs"
                >
                  Guardar y Refrescar Base
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
